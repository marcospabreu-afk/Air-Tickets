[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "passagens"
version = "0.1.0"
description = "Busca, compara e monitora preços de passagens aéreas"
requires-python = ">=3.10"
dependencies = ["requests>=2.31", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "flask>=3.0", "aiosmtpd>=1.4"]
web = ["flask>=3.0", "gunicorn>=22", "psycopg[binary]>=3.2"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
passagens = "passagens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
passagens = ["templates/*.html", "templates/*.js", "dados/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
