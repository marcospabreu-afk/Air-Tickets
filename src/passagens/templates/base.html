<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Passagens{% endblock %}</title>
<style>
  :root {
    --fundo: #f6f7f9; --cartao: #ffffff; --texto: #1c2430; --suave: #5b6676;
    --borda: #dde2e8; --destaque: #1f5fbf; --destaque-texto: #ffffff;
    --alerta-fundo: #fff4e5; --alerta-borda: #f0a33a; --alerta-texto: #7a4300;
    --ok-fundo: #eaf6ee; --ok-texto: #1e6b3a; --erro-fundo: #fdecec; --erro-texto: #9b1c1c;
    --linha-par: #f9fafb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fundo: #12161c; --cartao: #1b2129; --texto: #e6eaf0; --suave: #9aa5b4;
      --borda: #2c3540; --destaque: #6aa3ff; --destaque-texto: #0b1220;
      --alerta-fundo: #3a2a12; --alerta-borda: #c98a2e; --alerta-texto: #ffd59a;
      --ok-fundo: #15301f; --ok-texto: #8fd8a8; --erro-fundo: #3b1717; --erro-texto: #ffb3b3;
      --linha-par: #1f262f;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fundo); color: var(--texto);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--cartao); border-bottom: 1px solid var(--borda); }
  .barra { max-width: 1200px; margin: 0 auto; padding: 12px 16px; display: flex;
           align-items: center; gap: 24px; flex-wrap: wrap; }
  .marca { font-weight: 700; font-size: 18px; }
  nav a { color: var(--suave); text-decoration: none; margin-right: 16px; }
  nav a.ativo { color: var(--destaque); font-weight: 600; }
  main { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 16px; }
  .cartao { background: var(--cartao); border: 1px solid var(--borda); border-radius: 10px;
            padding: 16px; margin-bottom: 16px; }
  .aviso { border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
  .aviso.erro { background: var(--erro-fundo); color: var(--erro-texto); }
  .aviso.info { background: var(--alerta-fundo); color: var(--alerta-texto); }
  .formulario { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px;
                align-items: start; }
  .formulario > div:last-child { align-self: center; }
  label { display: block; font-size: 13px; color: var(--suave); margin-bottom: 4px; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--borda); border-radius: 8px;
                  background: var(--fundo); color: var(--texto); font: inherit; }
  .campo-aeroporto { position: relative; }
  .sugestoes { position: absolute; z-index: 10; left: 0; right: 0; top: 100%; margin: 2px 0 0;
               padding: 4px; list-style: none; background: var(--cartao); border: 1px solid var(--borda);
               border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.15); max-height: 320px;
               overflow-y: auto; min-width: min(300px, calc(100vw - 32px)); }
  /* o campo da direita abre a lista alinhada à direita, para não sair da tela */
  .campo-aeroporto + .campo-aeroporto .sugestoes { left: auto; right: 0; }
  .sugestoes li { display: grid; grid-template-columns: 40px 1fr; gap: 0 8px; padding: 7px 8px;
                  border-radius: 6px; cursor: pointer; font-size: 14px; }
  .sugestoes li b { grid-row: span 2; color: var(--destaque); }
  .sugestoes li em { font-style: normal; font-size: 12px; color: var(--suave); }
  .sugestoes li:hover, .sugestoes li[aria-selected=true] { background: var(--linha-par); }
  .rotulo-aeroporto { display: block; min-height: 1.2em; margin-top: 3px; font-size: 12px;
                      color: var(--suave); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  button { padding: 10px 18px; border: 0; border-radius: 8px; background: var(--destaque);
           color: var(--destaque-texto); font: inherit; font-weight: 600; cursor: pointer; }
  button[disabled] { opacity: .6; cursor: wait; }
  .dica { font-size: 13px; color: var(--suave); margin: 10px 0 0; }
  .resumo { color: var(--suave); margin: 0 0 10px; }
  .tabela { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--borda); text-align: left; white-space: nowrap; }
  th { color: var(--suave); font-weight: 600; font-size: 13px; }
  tbody tr:nth-child(even) { background: var(--linha-par); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
  td a { color: var(--destaque); }
  .selo { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .selo.alerta { background: var(--alerta-fundo); color: var(--alerta-texto); border: 1px solid var(--alerta-borda); }
  .selo.ok { background: var(--ok-fundo); color: var(--ok-texto); }
  .mais-barato td { font-weight: 600; }
  small.anunciado { font-weight: 400; font-size: 12px; color: var(--suave); }
  button.secundario { background: transparent; color: var(--destaque); border: 1px solid var(--destaque);
                      padding: 4px 10px; font-size: 13px; font-weight: 500; }
  .filtros summary { cursor: pointer; font-weight: 600; margin-bottom: 0; }
  .filtros[open] summary { margin-bottom: 12px; }
  .filtros summary span { font-weight: 400; color: var(--suave); }
  .filtros-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
  .filtros input[type=range] { padding: 0; accent-color: var(--destaque); }
  .filtros fieldset { border: 0; border-top: 1px solid var(--borda); margin: 14px 0 0; padding: 10px 0 0; }
  .filtros legend { font-size: 13px; color: var(--suave); padding: 0 6px 0 0; }
  .opcao { display: inline-flex; align-items: center; gap: 5px; margin: 4px 14px 4px 0; font-size: 14px;
           color: var(--texto); white-space: nowrap; }
  .opcao input { width: auto; }
  .opcao small { color: var(--suave); }
  .atalhos { font-size: 13px; white-space: nowrap; }
  .atalhos a { color: var(--destaque); }
  .filtros-rodape { display: flex; justify-content: space-between; align-items: center; gap: 12px;
                    margin: 12px 0 0; color: var(--suave); flex-wrap: wrap; }
</style>
</head>
<body>
<header>
  <div class="barra">
    <span class="marca">✈ Passagens</span>
    <nav>
      <a href="/" class="{{ 'ativo' if pagina == 'busca' }}">Buscar</a>
      <a href="/historico" class="{{ 'ativo' if pagina == 'historico' }}">Histórico</a>
      <a href="/monitorar" class="{{ 'ativo' if pagina == 'monitorar' }}">Monitorar</a>
    </nav>
  </div>
</header>
<main>
  {% if erro_provedor %}<div class="aviso erro">{{ erro_provedor }}</div>{% endif %}
  {% if provedor and not provedor.dados_reais %}
    <div class="aviso info">Provedor falso ativo: os preços são fictícios, apenas para demonstração.</div>
  {% endif %}
  {% block conteudo %}{% endblock %}
</main>
<script>
  document.querySelectorAll("form[data-carregando]").forEach(function (f) {
    f.addEventListener("submit", function () {
      var b = f.querySelector("button");
      b.disabled = true; b.textContent = f.dataset.carregando;
    });
  });
</script>
{% block scripts %}{% endblock %}
</body>
</html>
